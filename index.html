<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#24364b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="予定管理">
<title>スケジュール管理</title>

<style>
*{box-sizing:border-box}
:root{
  --navy:#24364b;
  --navy2:#304c69;
  --bg:#f4f6f8;
  --card:#fff;
  --line:#d7dee7;
  --text:#1f2937;
  --muted:#6b7280;
  --light:#eef2f6;
  --danger:#b42318;
}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,
  "Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
}
button,input,textarea{font:inherit}
button{cursor:pointer}

header{
  position:sticky;
  top:0;
  z-index:20;
  color:#fff;
  background:linear-gradient(180deg,var(--navy),var(--navy2));
  padding:calc(15px + env(safe-area-inset-top)) 14px 15px;
  box-shadow:0 3px 16px rgba(0,0,0,.15);
}
header h1{
  margin:0 0 4px;
  font-size:25px;
}
.dateText{
  font-size:14px;
  opacity:.85;
}
.dateNav{
  display:grid;
  grid-template-columns:auto 1fr auto;
  gap:8px;
  align-items:center;
  margin-top:13px;
}
.dateNav button{
  border:0;
  color:#fff;
  background:rgba(255,255,255,.14);
  border-radius:11px;
  padding:10px 13px;
  font-weight:700;
}
.dateNav input{
  width:100%;
  border:0;
  border-radius:11px;
  padding:10px;
  text-align:center;
}

main{
  max-width:760px;
  margin:auto;
  padding:13px 12px calc(30px + env(safe-area-inset-bottom));
}
.card{
  background:var(--card);
  border-radius:17px;
  padding:15px;
  margin-bottom:12px;
  box-shadow:0 4px 16px rgba(30,45,60,.06);
}
.card h2{
  margin:0 0 12px;
  font-size:17px;
}
.sectionHead{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:8px;
  margin-bottom:12px;
}
.sectionHead h2{margin:0}

.todayBtn,.primary,.secondary,.danger{
  border:0;
  border-radius:10px;
  padding:10px 12px;
  font-weight:700;
}
.primary{
  color:#fff;
  background:var(--navy);
}
.secondary{
  color:var(--text);
  background:var(--light);
}
.danger{
  color:var(--danger);
  background:#fdecec;
}

.topItem{
  display:flex;
  align-items:center;
  gap:10px;
  border:1px solid var(--line);
  border-radius:12px;
  padding:10px;
  margin-bottom:8px;
}
.topItem input[type=checkbox]{
  width:23px;
  height:23px;
}
.topItem input[type=text]{
  flex:1;
  border:0;
  outline:0;
  font-size:16px;
  background:transparent;
}
.topItem.done input[type=text]{
  color:var(--muted);
  text-decoration:line-through;
}

.timeline{
  border-top:1px solid var(--line);
}
.slot{
  display:grid;
  grid-template-columns:62px 1fr;
  min-height:52px;
  border-bottom:1px solid var(--line);
}
.slotTime{
  padding:12px 8px 8px 0;
  font-size:13px;
  font-weight:800;
  color:var(--muted);
}
.slotBody{
  padding:7px 0 7px 8px;
  border-left:1px solid var(--line);
}
.slotEmpty{
  width:100%;
  min-height:36px;
  border:0;
  background:transparent;
  color:#9aa3ae;
  text-align:left;
}
.task{
  border:1px solid #cfd8e2;
  background:#f8fafc;
  border-radius:11px;
  padding:9px 10px;
  margin-bottom:6px;
}
.task.done{
  opacity:.58;
}
.task.done .taskTitle{
  text-decoration:line-through;
}
.taskTop{
  display:flex;
  align-items:center;
  gap:8px;
}
.taskCheck{
  width:23px;
  height:23px;
}
.taskTitle{
  font-weight:800;
  flex:1;
}
.taskNote{
  margin:5px 0 0 31px;
  font-size:13px;
  color:var(--muted);
  white-space:pre-wrap;
}
.taskButtons{
  margin:7px 0 0 31px;
  display:flex;
  gap:5px;
}
.taskButtons button{
  border:0;
  border-radius:7px;
  background:#e9eef3;
  padding:6px 9px;
  font-size:12px;
}
.taskButtons .delete{color:var(--danger)}

textarea{
  width:100%;
  min-height:120px;
  border:1px solid var(--line);
  border-radius:11px;
  padding:11px;
  font-size:16px;
  resize:vertical;
}

.grid2{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

.actionsBar{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}
.actionsBar button{
  flex:1;
  min-width:150px;
}

dialog{
  width:calc(100% - 28px);
  max-width:500px;
  border:0;
  border-radius:17px;
  padding:18px;
}
dialog::backdrop{
  background:rgba(0,0,0,.45);
}
dialog h2{margin-top:0}
dialog label{
  display:block;
  font-weight:700;
  font-size:13px;
  margin-top:10px;
}
dialog input,dialog textarea{
  width:100%;
  margin-top:6px;
  border:1px solid var(--line);
  border-radius:10px;
  padding:11px;
}
dialog textarea{min-height:80px}
.dialogBtns{
  display:flex;
  justify-content:flex-end;
  gap:8px;
  margin-top:15px;
}

@media(max-width:640px){
  .grid2{grid-template-columns:1fr}
}
</style>
</head>

<body>

<header>
  <h1>スケジュール管理</h1>
  <div id="dateText" class="dateText"></div>

  <div class="dateNav">
    <button onclick="moveDay(-1)">← 前日</button>
    <input id="datePicker" type="date">
    <button onclick="moveDay(1)">翌日 →</button>
  </div>
</header>

<main>

<section class="card">
  <div class="sectionHead">
    <h2>★ 今日絶対にやること TOP 3</h2>
    <button class="secondary" onclick="goToday()">今日</button>
  </div>

  <div id="top3"></div>
</section>

<section class="card">
  <div class="sectionHead">
    <h2>時間別スケジュール</h2>
    <button class="primary" onclick="openTask()">＋ 予定追加</button>
  </div>

  <div id="timeline" class="timeline"></div>
</section>

<section class="card grid2">
  <div>
    <h2>📝 メモ・備忘録</h2>
    <textarea id="memo"
      placeholder="忘れたくないこと、買う物、電話する相手など"></textarea>
  </div>

  <div>
    <h2>→ 翌日へ持ち越し</h2>
    <textarea id="carry"
      placeholder="翌日に回したいこと"></textarea>
  </div>
</section>

<section class="card">
  <div class="actionsBar">
    <button class="primary" onclick="copyCarryToTomorrow()">
      持ち越しを翌日にコピー
    </button>

    <button class="secondary" onclick="copyIncompleteToTomorrow()">
      未完了予定を翌日にコピー
    </button>

    <button class="danger" onclick="resetDay()">
      この日をリセット
    </button>
  </div>
</section>

</main>

<dialog id="taskDialog">
  <h2 id="dialogTitle">予定を追加</h2>

  <input id="editId" type="hidden">

  <label>
    時間
    <input id="taskTime" type="time" step="1800">
  </label>

  <label>
    やること
    <input id="taskTitle" type="text"
      placeholder="例：役所に電話">
  </label>

  <label>
    備考
    <textarea id="taskNote"
      placeholder="場所・持ち物・補足など"></textarea>
  </label>

  <div class="dialogBtns">
    <button class="secondary" onclick="closeTask()">キャンセル</button>
    <button class="primary" onclick="saveTask()">保存</button>
  </div>
</dialog>

<script>
const DB_KEY="dailyScheduleV2";
const OLD_KEY="dailyScheduleApp";

function ymd(d){
  const y=d.getFullYear();
  const m=String(d.getMonth()+1).padStart(2,"0");
  const day=String(d.getDate()).padStart(2,"0");
  return `${y}-${m}-${day}`;
}

function newDay(){
  return{
    top:["","",""],
    topDone:[false,false,false],
    tasks:[],
    memo:"",
    carry:""
  };
}

let db={};
let selectedDate=ymd(new Date());

function loadDB(){
  try{
    db=JSON.parse(localStorage.getItem(DB_KEY))||{};
  }catch{
    db={};
  }

  if(!localStorage.getItem(DB_KEY)){
    try{
      const old=JSON.parse(localStorage.getItem(OLD_KEY));
      if(old){
        db[selectedDate]={
          top:old.top||["","",""],
          topDone:old.topDone||[false,false,false],
          tasks:old.tasks||[],
          memo:old.memo||"",
          carry:old.tomorrow||""
        };
        saveDB();
      }
    }catch{}
  }
}

function saveDB(){
  localStorage.setItem(DB_KEY,JSON.stringify(db));
}

function dayData(){
  if(!db[selectedDate]) db[selectedDate]=newDay();
  return db[selectedDate];
}

function dateObject(str){
  const [y,m,d]=str.split("-").map(Number);
  return new Date(y,m-1,d);
}

function renderDate(){
  const d=dateObject(selectedDate);

  document.getElementById("dateText").textContent=
    new Intl.DateTimeFormat("ja-JP",{
      year:"numeric",
      month:"long",
      day:"numeric",
      weekday:"short"
    }).format(d);

  document.getElementById("datePicker").value=selectedDate;
}

function moveDay(amount){
  const d=dateObject(selectedDate);
  d.setDate(d.getDate()+amount);
  selectedDate=ymd(d);
  renderAll();
}

function goToday(){
  selectedDate=ymd(new Date());
  renderAll();
}

document.getElementById("datePicker").addEventListener("change",e=>{
  if(e.target.value){
    selectedDate=e.target.value;
    renderAll();
  }
});

function renderTop(){
  const data=dayData();
  const box=document.getElementById("top3");
  box.innerHTML="";

  for(let i=0;i<3;i++){
    const row=document.createElement("div");
    row.className="topItem"+(data.topDone[i]?" done":"");

    const check=document.createElement("input");
    check.type="checkbox";
    check.checked=!!data.topDone[i];

    check.onchange=()=>{
      data.topDone[i]=check.checked;
      saveDB();
      renderTop();
    };

    const text=document.createElement("input");
    text.type="text";
    text.placeholder=`${i+1}. 必ずやること`;
    text.value=data.top[i]||"";

    text.oninput=()=>{
      data.top[i]=text.value;
      saveDB();
    };

    row.append(check,text);
    box.append(row);
  }
}

function halfHourTimes(){
  const times=[];

  for(let h=6;h<=23;h++){
    times.push(`${String(h).padStart(2,"0")}:00`);
    times.push(`${String(h).padStart(2,"0")}:30`);
  }

  return times;
}

function renderTimeline(){
  const data=dayData();
  const box=document.getElementById("timeline");
  box.innerHTML="";

  halfHourTimes().forEach(time=>{
    const slot=document.createElement("div");
    slot.className="slot";

    const timeBox=document.createElement("div");
    timeBox.className="slotTime";
    timeBox.textContent=time;

    const body=document.createElement("div");
    body.className="slotBody";

    const tasks=data.tasks
      .filter(t=>t.time===time)
      .sort((a,b)=>a.id-b.id);

    tasks.forEach(task=>{
      const taskBox=document.createElement("div");
      taskBox.className="task"+(task.done?" done":"");

      const top=document.createElement("div");
      top.className="taskTop";

      const check=document.createElement("input");
      check.type="checkbox";
      check.className="taskCheck";
      check.checked=task.done;

      check.onchange=()=>{
        task.done=check.checked;
        saveDB();
        renderTimeline();
      };

      const title=document.createElement("div");
      title.className="taskTitle";
      title.textContent=task.title;

      top.append(check,title);

      const note=document.createElement("div");
      note.className="taskNote";
      note.textContent=task.note||"";

      const btns=document.createElement("div");
      btns.className="taskButtons";

      const edit=document.createElement("button");
      edit.textContent="編集";
      edit.onclick=()=>openTask(task);

      const del=document.createElement("button");
      del.textContent="削除";
      del.className="delete";
      del.onclick=()=>{
        if(confirm("この予定を削除しますか？")){
          data.tasks=data.tasks.filter(x=>x.id!==task.id);
          db[selectedDate]=data;
          saveDB();
          renderTimeline();
        }
      };

      btns.append(edit,del);
      taskBox.append(top);

      if(task.note) taskBox.append(note);

      taskBox.append(btns);
      body.append(taskBox);
    });

    const add=document.createElement("button");
    add.className="slotEmpty";
    add.textContent=tasks.length ? "＋ この時間に追加" : "＋ 予定";
    add.onclick=()=>openTask(null,time);

    body.append(add);
    slot.append(timeBox,body);
    box.append(slot);
  });
}

const dialog=document.getElementById("taskDialog");

function openTask(task=null,time=null){
  document.getElementById("dialogTitle").textContent=
    task ? "予定を編集" : "予定を追加";

  document.getElementById("editId").value=
    task ? task.id : "";

  document.getElementById("taskTime").value=
    task ? task.time : (time||"09:00");

  document.getElementById("taskTitle").value=
    task ? task.title : "";

  document.getElementById("taskNote").value=
    task ? (task.note||"") : "";

  dialog.showModal();
}

function closeTask(){
  dialog.close();
}

function saveTask(){
  const data=dayData();

  const id=document.getElementById("editId").value;
  const time=document.getElementById("taskTime").value;
  const title=document.getElementById("taskTitle").value.trim();
  const note=document.getElementById("taskNote").value.trim();

  if(!title){
    alert("やることを入力してください");
    return;
  }

  if(id){
    const task=data.tasks.find(t=>String(t.id)===String(id));

    if(task){
      task.time=time;
      task.title=title;
      task.note=note;
    }
  }else{
    data.tasks.push({
      id:Date.now(),
      time,
      title,
      note,
      done:false
    });
  }

  saveDB();
  renderTimeline();
  closeTask();
}

function bindTextareas(){
  const data=dayData();

  const memo=document.getElementById("memo");
  const carry=document.getElementById("carry");

  memo.value=data.memo||"";
  carry.value=data.carry||"";

  memo.oninput=()=>{
    dayData().memo=memo.value;
    saveDB();
  };

  carry.oninput=()=>{
    dayData().carry=carry.value;
    saveDB();
  };
}

function tomorrowDate(){
  const d=dateObject(selectedDate);
  d.setDate(d.getDate()+1);
  return ymd(d);
}

function copyCarryToTomorrow(){
  const text=dayData().carry.trim();

  if(!text){
    alert("持ち越し欄が空です");
    return;
  }

  const next=tomorrowDate();

  if(!db[next]) db[next]=newDay();

  db[next].memo=
    (db[next].memo ? db[next].memo+"\n\n" : "")+
    "【前日からの持ち越し】\n"+
    text;

  saveDB();

  alert("翌日のメモへコピーしました");
}

function copyIncompleteToTomorrow(){
  const current=dayData();

  const incomplete=current.tasks.filter(t=>!t.done);

  if(!incomplete.length){
    alert("未完了の予定はありません");
    return;
  }

  const next=tomorrowDate();

  if(!db[next]) db[next]=newDay();

  incomplete.forEach(t=>{
    db[next].tasks.push({
      id:Date.now()+Math.random(),
      time:t.time,
      title:t.title,
      note:t.note,
      done:false
    });
  });

  saveDB();

  alert(`${incomplete.length}件を翌日にコピーしました`);
}

function resetDay(){
  if(confirm("この日の内容をすべて削除しますか？")){
    db[selectedDate]=newDay();
    saveDB();
    renderAll();
  }
}

function renderAll(){
  renderDate();
  renderTop();
  renderTimeline();
  bindTextareas();
}

loadDB();
renderAll();
</script>

</body>
</html>
